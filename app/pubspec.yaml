name: jizhangben
description: "一款支持 Windows 和 macOS 的本地多货币记账应用。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  drift: ^2.34.2
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  # drift_dev 2.34.0 uses the DartPlaceholder API from sqlparser 0.44.0.
  sqlparser: 0.44.0

flutter:
  uses-material-design: true
